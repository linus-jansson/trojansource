name: Publish npm packages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global npm@11.15.0 pnpm@10.33.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - run: pnpm run build:npm-binaries
      - name: Pack platform packages
        run: |
          mkdir -p "$RUNNER_TEMP/trojansource-packages"
          for package in packages/*; do
            pnpm --dir "$package" pack --pack-destination "$RUNNER_TEMP/trojansource-packages"
          done
      - name: Publish platform packages
        run: |
          for package in "$RUNNER_TEMP"/trojansource-packages/*.tgz; do
            npm stage publish "$package" --access public
          done
      - name: Pack launcher package
        run: |
          mkdir -p "$RUNNER_TEMP/trojansource-launcher"
          pnpm pack --pack-destination "$RUNNER_TEMP/trojansource-launcher"
      - name: Publish launcher package
        run: npm stage publish "$RUNNER_TEMP/trojansource-launcher"/*.tgz
